# Streamlit theme config for Mirra.
#
# This file must live at `.streamlit/config.toml` — Streamlit reads the theme
# from nowhere else. It used to sit at the repo root, where neither the local
# dev server nor Streamlit Cloud ever picked it up, so every widget fell back
# to Streamlit's default red accent (and to the dark theme on dark-mode
# machines) while app.py's CSS kept forcing the cream background — which is
# how we ended up with black buttons and unreadable labels on a cream page.
#
# Why this exists: when a user's phone is in dark mode, Streamlit Cloud
# defaults to its built-in dark theme — which makes the background black
# and clashes hard with Mirra's cream/sage design. Setting `base = "light"`
# here forces Streamlit to ignore the OS preference and always serve the
# light theme.
#
# The color values mirror the cream/sage palette used in app.py's custom
# CSS so Streamlit's native widgets (buttons, text inputs, sliders, etc.)
# pick up matching colors instead of clashing with the custom styling.

[theme]
base = "light"

# Mirra's cream background — matches the `background-color: #faf9f5` rule
# used on `.stApp` in app.py.
backgroundColor = "#faf9f5"

# Slightly warmer cream for sidebar / secondary surfaces.
secondaryBackgroundColor = "#f0efe8"

# Sage green — Mirra's accent color. Used by Streamlit for primary buttons,
# slider tracks, focused input outlines, and progress indicators.
primaryColor = "#3dab7a"

# Body text.
textColor = "#2a2a2a"

font = "sans serif"
